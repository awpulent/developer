<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashRev</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%230b0d16'/%3E%3Cpath fill='%23ff4040' d='M24 54 40 38v10h12v12H40v10z'/%3E%3Cpath fill='%234080ff' d='M84 54 68 38v10H56v12h12v10z'/%3E%3Cpath fill='%23ffe040' d='M54 20 70 36H60v10H48V36H38z'/%3E%3Cpath fill='%23c040ff' d='M54 88 70 72H60V62H48v10H38z'/%3E%3C/svg%3E">

<body>
  <canvas id="game" class="hidden"></canvas>
  <div id="ui"></div>
  <div id="pause-menu" class="overlay hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button class="btn primary" data-action="resume">Resume <span class="kbd">Enter</span></button>
      <button class="btn" data-action="restart">Restart <span class="kbd">R</span></button>
      <button class="btn danger" data-action="quit">Quit <span class="kbd">Q</span></button>
    </div>
  </div>
  <script src="js/util.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/library.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
